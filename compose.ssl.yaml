services:
  web:
    environment:
      COOKIE_SECURE: "true"
  proxy:
    image: nginx:stable-alpine
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "${SSL_BIND_IP:?Run Start-HTTPS.ps1}:443:443"
    volumes:
      - ./ssl/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl/certs/server.crt:/etc/nginx/certs/server.crt:ro
      - ./ssl/certs/server.key:/etc/nginx/certs/server.key:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
